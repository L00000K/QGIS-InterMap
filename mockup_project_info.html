<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Info Panel — CAD Title Block Mockup</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #c0c4cc;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    padding: 40px 16px;
    gap: 40px;
  }

  /* ── Map sheet (left) ───────────────────────────────────────────── */
  .map-sheet {
    display: flex;
    flex-direction: row;
    border: 2px solid #1a1a1a;
    box-shadow: 5px 5px 16px rgba(0,0,0,0.4);
    background: #fff;
  }

  .map-area {
    width: 520px;
    height: 620px;
    background: #dce5ec;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #7a8f9b;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border-right: 2px solid #1a1a1a;
    flex-shrink: 0;
  }

  /* ── Title block (right vertical strip) ─────────────────────────── */
  .title-block {
    width: 180px;
    display: flex;
    flex-direction: column;
    border-left: 0; /* already handled by map-area border-right */
  }

  /* Each section row */
  .tb-section {
    display: flex;
    flex-direction: column;
    border-bottom: 1px solid #1a1a1a;
    flex-shrink: 0;
  }
  .tb-section:last-child { border-bottom: none; flex: 1; }

  /* Label header band */
  .sec-label {
    background: #f0f0f0;
    padding: 2px 6px;
    font-size: 7px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #3f32f1;
    border-bottom: 1px solid #d0d0d0;
    line-height: 1.4;
  }

  /* Value area */
  .sec-value {
    padding: 6px 6px 8px 6px;
    font-size: 11px;
    font-weight: 700;
    color: #1a1a1a;
    line-height: 1.3;
    word-break: break-word;
  }

  /* Image / logo placeholder */
  .img-ph {
    margin: 4px 6px 8px 6px;
    background: #edf0f5;
    border: 1px dashed #b0b5be;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #b0b5be;
    font-size: 7.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 400;
    height: 46px;
  }

  /* Produced-by section: logo centred */
  .logo-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 8px 10px 8px;
  }
  .logo-wrap svg { width: 130px; height: auto; }

  /* Split row: REVISION | PURPOSE OF ISSUE */
  .tb-split {
    display: flex;
    flex-direction: row;
    border-bottom: 1px solid #1a1a1a;
    flex-shrink: 0;
  }
  .tb-split .tb-section {
    flex: 1;
    border-bottom: none;
    border-right: 1px solid #1a1a1a;
  }
  .tb-split .tb-section:last-child { border-right: none; }

  /* Doc-control section */
  .dc-header {
    background: #f0f0f0;
    padding: 2px 6px;
    font-size: 7px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #3f32f1;
    border-bottom: 1px solid #d0d0d0;
  }
  .dc-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 8px;
  }
  .dc-table td {
    padding: 3px 5px;
    border-bottom: 1px solid #e8e8e8;
    color: #1a1a1a;
    vertical-align: middle;
  }
  .dc-table tr:last-child td { border-bottom: none; }
  .dc-table td.role {
    font-weight: 700;
    color: #333;
    white-space: nowrap;
    width: 38%;
  }
  .dc-table td.person { color: #888; width: 31%; }
  .dc-table td.date   { color: #888; width: 31%; }
</style>
</head>

    <!-- DOCUMENT NAME -->

      </div>

    <div class="tb-section" style="flex:1;">
      <div class="dc-header">Document Control</div>

          <td class="role">Originated</td>
