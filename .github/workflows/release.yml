name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload zip to (e.g. v1.3.0). Leave blank to just build."
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build plugin zip
        run: python3 build.py --out-dir dist

      - name: Upload zip to release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zip=$(ls dist/*.zip | head -1)
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          gh release upload "$tag" "$zip" --clobber
