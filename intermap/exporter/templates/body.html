@@_report_pane_html@@
<div id="map-wrap">
<div id="report-media"><div id="report-media-card"></div></div>
<button id="report-restore" title="Re-open report">&#128214; Report</button>
<div id="map-title-chip">
  <div id="map-title-chip-inner">
    <div id="map-title-chip-text"></div>
    <div id="map-title-chip-views"></div>
  </div>
  <button id="map-title-chip-btn" title="Open project info">&#9660;</button>
</div>
<div id="map"></div>
<div id="cesium-container"></div>
<div id="cesium-loading">Loading 3D view…</div>
<div id="cesium-slicer-ui" style="display:none;position:absolute;top:10px;right:10px;z-index:300;background:rgba(0,0,0,0.7);padding:8px;border-radius:4px;color:#fff;font-size:12px;">
  <label style="display:block;margin-bottom:6px;"><input type="checkbox" id="cesium-slicer-toggle" /> Vertical slicer (drag)</label>
  <div style="font-size:11px;opacity:0.8;">Drag left/right to slice</div>
</div>
<canvas id="cesium-slicer-canvas" style="display:none;position:absolute;top:0;left:0;z-index:250;pointer-events:none;"></canvas>
<button id="permalink-btn" title="Copy link to current view">&#128279; Link</button>
<button id="print-btn" title="Print map">&#128438; Print</button>
<div id="select-rect"></div>
<div id="label-overlay"><svg id="label-svg" style="position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible;"></svg></div>
@@_filterbar_html@@
@@_searchbar_html@@
<div id="legend" style="display:none"></div>
<div id="spread-leader-overlay" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:450;overflow:hidden;">
  <svg id="spread-leader-svg" style="width:100%;height:100%;overflow:visible;"></svg>
</div>
<div id="info-panel">
  <div id="info-panel-hdr">
    <span>Feature Info</span>
    <button id="info-panel-close" title="Close">&#10005;</button>
  </div>
  <div id="info-panel-body">Click a map feature to see its attributes.</div>
  <div id="info-panel-resize-h"></div>
</div>
